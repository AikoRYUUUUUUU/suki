<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suki — Biblioteca de Mangás</title>
<meta name="description" content="{{ meta_description }}">
<link rel="canonical" href="{{ canonical_url }}">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Suki">
<meta property="og:title" content="Suki — Biblioteca de Mangás">
<meta property="og:description" content="{{ meta_description }}">
<meta property="og:url" content="{{ canonical_url }}">
<meta property="og:image" content="{{ og_image }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Suki — Biblioteca de Mangás">
<meta name="twitter:description" content="{{ meta_description }}">
<meta name="twitter:image" content="{{ og_image }}">

<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='assets/logo.svg') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a href="/" class="brand"><img class="stamp" src="{{ url_for('static', filename='assets/logo.svg') }}" alt=""><img class="wordmark" src="{{ url_for('static', filename='assets/wordmark.svg') }}" alt="Suki"></a>
    <form class="topbar-search" role="search" action="{{ url_for('search_page') }}" method="get">
      <button type="submit" class="search-icon-btn" aria-label="Buscar">
        <svg class="search-icon" viewBox="0 0 20 20" aria-hidden="true">
          <path d="M13.61 12.2h-.7l-.25-.24a5.8 5.8 0 1 0-.62.62l.24.25v.7l4.46 4.45 1.33-1.33-4.46-4.45zm-5.35 0a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/>
        </svg>
      </button>
      <input type="text" name="q" placeholder="Buscar por nome, autor, grupo, tag ou gênero…">
      <select name="status" aria-label="Filtrar por status">
        <option value="">Status</option>
        {% for s in statuses %}
          <option value="{{ s }}">{{ s }}</option>
        {% endfor %}
      </select>
    </form>
    <nav class="nav-links" id="nav-links">
      <a href="{{ url_for('search_page') }}">Biblioteca</a>
      <a href="/#lancamentos">Lançamentos</a>
      <a href="{{ url_for('search_page') }}#tag-filter">Gêneros</a>
    </nav>
    <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="nav-links">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <div>
      <h1 class="hero-title">Leia mangás <span class="accent">sem ruído</span></h1>
      <div class="hero-manga" id="hero-manga">
        <p class="hero-manga-title" id="hero-manga-title">Carregando…</p>
        <p class="hero-sub" id="hero-synopsis"></p>
        <div class="hero-tags" id="hero-tags"></div>
      </div>
      <div class="hero-actions">
        <a class="btn btn-primary" id="hero-read-btn" href="#">Começar a ler</a>
        <a class="btn btn-ghost" id="hero-cover-btn" href="#">Ver detalhes</a>
      </div>
    </div>
    <div class="hero-cover" id="hero-cover">
      <img id="hero-cover-img" src="" alt="">
    </div>
  </div>
</section>

<section class="shelf" id="lancamentos">
  <div class="wrap">
    <p class="eyebrow">Biblioteca</p>
    <h2 class="section-title">Todos os títulos</h2>

    <div class="grid-covers" id="grid-covers"></div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">© 2026 Suki · Biblioteca de mangás</div>
</footer>

<script src="{{ url_for('static', filename='js/nav.js') }}"></script>
<script src="{{ url_for('static', filename='js/data.js') }}"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
