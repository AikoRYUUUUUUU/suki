<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">{{ page_title }}</title>
<meta name="description" content="{{ meta_description }}">
<link rel="canonical" href="{{ canonical_url }}">
{% if not manga %}<meta name="robots" content="noindex">{% endif %}

<meta property="og:type" content="book">
<meta property="og:site_name" content="Suki">
<meta property="og:title" content="{{ page_title }}">
<meta property="og:description" content="{{ meta_description }}">
<meta property="og:url" content="{{ canonical_url }}">
<meta property="og:image" content="{{ og_image }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page_title }}">
<meta name="twitter:description" content="{{ meta_description }}">
<meta name="twitter:image" content="{{ og_image }}">

{% if structured_data %}
<script type="application/ld+json">{{ structured_data | tojson }}</script>
{% endif %}

<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='assets/logo.svg') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a href="{{ url_for('index') }}" class="brand"><img class="stamp" src="{{ url_for('static', filename='assets/logo.svg') }}" alt=""><img class="wordmark" src="{{ url_for('static', filename='assets/wordmark.svg') }}" alt="Suki"></a>
    <nav class="nav-links" id="nav-links">
      <a href="{{ url_for('search_page') }}">Biblioteca</a>
      <a href="{{ url_for('index') }}#lancamentos">Lançamentos</a>
      <a href="{{ url_for('search_page') }}#tag-filter">Gêneros</a>
    </nav>
    <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="nav-links">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<section class="manga-hero">
  <div class="wrap">
    <div class="cover-frame">
      <img id="cover-img" src="" alt="">
    </div>
    <div class="manga-info">
      <p class="title-jp" id="title-jp"></p>
      <h1 id="title-pt"></h1>
      <div class="manga-meta-row" id="genres-row"></div>
      <p class="manga-synopsis" id="synopsis"></p>

      <div class="stat-row">
        <div class="stat"><b id="stat-chapters">–</b><span>Capítulos</span></div>
        <div class="stat"><b id="stat-rating">–</b><span>Avaliação</span></div>
        <div class="stat"><b id="stat-year">–</b><span>Publicação</span></div>
        <div class="stat"><b id="stat-status">–</b><span>Status</span></div>
      </div>

      <div class="hero-actions">
        <a class="btn btn-primary" id="start-reading">Começar a ler</a>
      </div>

      <div class="rate-widget" id="rate-widget">
        <span class="rate-widget-label">Avalie este mangá</span>
        <div class="rate-stars" id="rate-stars">
          <button type="button" class="rate-star" data-value="1" aria-label="1 estrela">★</button>
          <button type="button" class="rate-star" data-value="2" aria-label="2 estrelas">★</button>
          <button type="button" class="rate-star" data-value="3" aria-label="3 estrelas">★</button>
          <button type="button" class="rate-star" data-value="4" aria-label="4 estrelas">★</button>
          <button type="button" class="rate-star" data-value="5" aria-label="5 estrelas">★</button>
        </div>
        <span class="rate-widget-msg" id="rate-widget-msg"></span>
      </div>
    </div>
  </div>
</section>

<section class="chapters">
  <div class="wrap">
    <p class="eyebrow">Sumário</p>
    <h2 class="section-title">Capítulos</h2>
    <div class="chapter-list" id="chapter-list"></div>
  </div>
</section>

<section class="comments">
  <div class="wrap">
    <p class="eyebrow">Comunidade</p>
    <h2 class="section-title">Comentários</h2>

    <form class="comment-form" id="comment-form">
      <input type="text" name="author_name" placeholder="Seu nome" maxlength="50" required>
      <textarea name="body" placeholder="Deixe um comentário..." maxlength="2000" required></textarea>
      <input type="text" name="website" class="hp-field" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button type="submit" class="btn btn-primary">Comentar</button>
      <p class="comment-form-msg"></p>
    </form>

    <div class="comment-list" id="comment-list"></div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">© 2026 Suki · Biblioteca de mangás</div>
</footer>

<script src="{{ url_for('static', filename='js/nav.js') }}"></script>
<script src="{{ url_for('static', filename='js/data.js') }}"></script>
<script src="{{ url_for('static', filename='js/history.js') }}"></script>
<script src="{{ url_for('static', filename='js/manga.js') }}"></script>
</body>
</html>
