<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editar capítulo — Sumi</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a href="/" class="brand"><span class="stamp">墨</span> Sumi</a>
    <nav class="nav-links">
      <a href="{{ url_for('chapters_list', manga_id=manga_id) }}">← Capítulos</a>
    </nav>
  </div>
</header>

<div class="admin-shell wide">
  <div class="admin-header">
    <div>
      <p class="eyebrow">{{ manga_title }}</p>
      <h1>Editar capítulo</h1>
    </div>
  </div>

  <div class="admin-card">
    {% if error %}
      <p class="admin-error">{{ error }}</p>
    {% endif %}

    <form id="edit-chapter-form" class="admin-form" action="{{ url_for('update_chapter', manga_id=manga_id, chapter_id=chapter.id) }}" method="post" enctype="multipart/form-data">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" id="order-input" name="order" value="">

      <label for="number">Número do capítulo</label>
      <input type="text" id="number" name="number" inputmode="decimal" value="{{ format_number(chapter.number) }}" required>

      <label for="title">Título do capítulo</label>
      <input type="text" id="title" name="title" value="{{ chapter.title }}" required>

      <label for="release_date">Data de publicação</label>
      <input type="date" id="release_date" name="release_date" value="{{ chapter.release_date or '' }}" required>

      <div class="page-manager-header">
        <label style="margin:0;">Páginas</label>
        <button type="button" id="add-pages-btn" class="btn btn-ghost">Adicionar páginas</button>
      </div>
      <p class="admin-hint">Arraste pra reordenar. Clique no × pra remover uma página.</p>
      <div id="page-manager" class="page-manager"></div>
      <input type="file" id="new_pages_picker" accept="image/png,image/jpeg,image/webp" multiple style="display:none;">
      <input type="file" id="new_pages_submit" name="new_pages" multiple style="display:none;">
      <script type="application/json" id="initial-pages">{{ pages|tojson }}</script>

      <div class="admin-actions">
        <button type="submit" class="btn btn-primary">Salvar alterações</button>
        <a class="btn btn-ghost" href="{{ url_for('chapters_list', manga_id=manga_id) }}">Cancelar</a>
      </div>
    </form>
  </div>
</div>

<script src="{{ url_for('static', filename='js/admin_chapter_editor.js') }}"></script>
</body>
</html>
