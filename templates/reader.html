<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">{{ page_title }}</title>
<meta name="description" content="{{ meta_description }}">
<link rel="canonical" href="{{ canonical_url }}">
<meta name="robots" content="noindex, follow">

<meta property="og:type" content="article">
<meta property="og:site_name" content="Suki">
<meta property="og:title" content="{{ page_title }}">
<meta property="og:description" content="{{ meta_description }}">
<meta property="og:url" content="{{ canonical_url }}">
<meta property="og:image" content="{{ og_image }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page_title }}">
<meta name="twitter:description" content="{{ meta_description }}">
<meta name="twitter:image" content="{{ og_image }}">

<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='assets/logo.svg') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
</head>
<body class="reader-body">

<header class="reader-bar">
  <div class="wrap">
    <div class="reader-title">
      <a href="index.html" style="margin-right:14px;">←</a>
      <strong id="rt-manga">…</strong> · <span id="rt-chapter">…</span>
    </div>
    <div class="reader-controls">
      <button class="icon-btn chapter-prev-btn" title="Capítulo anterior">«</button>
      <select class="chapter-select" title="Selecionar capítulo"></select>
      <button class="icon-btn chapter-next-btn" title="Próximo capítulo">»</button>
      <span class="page-counter" id="page-counter">–/–</span>
      <button class="icon-btn" id="mode-toggle" title="Alternar modo de leitura">⇅</button>
    </div>
  </div>
</header>

<main class="reader-stage" id="reader-stage">
  <!-- páginas injetadas via JS -->
</main>

<!-- zonas de toque só usadas no modo paginado -->
<div class="reader-tapzones" id="tapzones" style="display:none;">
  <button id="zone-prev" aria-label="Página anterior"></button>
  <button id="zone-next" aria-label="Próxima página"></button>
</div>

<footer class="reader-bar reader-bar-bottom">
  <div class="wrap">
    <div class="reader-controls reader-controls-bottom">
      <button class="icon-btn chapter-prev-btn" title="Capítulo anterior">«</button>
      <select class="chapter-select" title="Selecionar capítulo"></select>
      <button class="icon-btn chapter-next-btn" title="Próximo capítulo">»</button>
    </div>
  </div>
</footer>

<script src="{{ url_for('static', filename='js/data.js') }}"></script>
<script src="{{ url_for('static', filename='js/history.js') }}"></script>
<script src="{{ url_for('static', filename='js/reader.js') }}"></script>
</body>
</html>
