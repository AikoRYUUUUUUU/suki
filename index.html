<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sumi — Biblioteca de Mangás</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a href="index.html" class="brand"><span class="stamp">墨</span> Sumi</a>
    <nav class="nav-links">
      <a href="index.html">Biblioteca</a>
      <a href="#lancamentos">Lançamentos</a>
      <a href="#">Gêneros</a>
    </nav>
  </div>
</header>

<section class="hero" id="hero">
  <div class="wrap">
    <div>
      <p class="eyebrow">Obra de teste</p>
      <h1 class="hero-title">Onde a tinta<br>ainda <span class="accent">respira.</span></h1>
      <p class="hero-sub" id="hero-synopsis">Carregando sinopse…</p>
      <div class="hero-actions">
        <a class="btn btn-primary" id="hero-read-btn" href="#">Ler agora</a>
        <a class="btn btn-ghost" id="hero-cover-btn" href="#">Ver capa</a>
      </div>
    </div>
    <div class="hero-cover">
      <img id="hero-cover-img" src="" alt="">
    </div>
  </div>
</section>

<section class="shelf" id="lancamentos">
  <div class="wrap">
    <p class="eyebrow">Catálogo</p>
    <h2 class="section-title">Na prateleira</h2>
    <div class="grid-covers" id="grid-covers">
      <!-- cards injetados via JS -->
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">Sumi · projeto de exemplo · conteúdo fictício gerado para testes</div>
</footer>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
